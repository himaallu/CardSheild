[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cardshield"
version = "0.1.0"
description = "Real-time card fraud scoring with cost-based thresholds, explanations and drift monitoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Core = what the serving container needs.
dependencies = [
    "numpy==2.5.3",
    "pandas==3.0.6",
    "lightgbm==4.7.0",
    "fastapi==0.142.2",
    "uvicorn==0.54.0",
    "pydantic==2.13.5",
    "prometheus-client==0.26.0",
]

[project.optional-dependencies]
train = [
    "scikit-learn==1.9.1",
    "mlflow==3.16.1",
    "matplotlib==3.11.2",
    "xgboost==3.4.1",
]
monitor = [
    "evidently==0.7.23",
    "httpx==0.28.1",
]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pandas-stubs==3.0.5.260914",
    "httpx==0.28.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["cardshield", "download_data"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src:scripts"
files = ["src", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["lightgbm.*", "mlflow.*", "evidently.*", "sklearn.*", "xgboost.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["scripts"]
